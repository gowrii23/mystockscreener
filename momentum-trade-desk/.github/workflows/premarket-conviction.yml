name: Pre-Market Nifty Conviction Check

on:
  schedule:
    # Mon-Fri 8:45 AM IST (03:15 UTC) — before market open
    - cron: "15 3 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: premarket-conviction
  cancel-in-progress: false

jobs:
  conviction-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Nifty conviction check (pre-market)
        run: python3 scan_nifty_conviction.py

      - name: Commit conviction log
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/nifty_setup.json data/conviction_results.csv
          if git diff --staged --quiet; then
            echo "No conviction output changes to commit"
          else
            git commit -m "chore: pre-market conviction check $(date -u +%Y-%m-%d)"
            git push
          fi
