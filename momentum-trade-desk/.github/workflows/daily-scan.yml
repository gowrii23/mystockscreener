name: Daily Momentum Scan

on:
  schedule:
    # Mon-Fri ~7:00 PM IST (13:30 UTC) — after NSE bhavcopy is published
    - cron: "30 13 * * 1-5"
  workflow_dispatch:
    inputs:
      backfill_days:
        description: "Backfill calendar days of bhavcopy (0 = today only)"
        required: false
        default: "0"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-momentum-scan
  cancel-in-progress: false

jobs:
  scan-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Restore bhavcopy cache
        uses: actions/cache@v4
        with:
          path: bhavcopy_data
          key: bhavcopy-${{ github.run_id }}
          restore-keys: |
            bhavcopy-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch bhavcopy data
        run: |
          BACKFILL="${{ github.event.inputs.backfill_days || '0' }}"
          if [ "$BACKFILL" != "0" ] && [ -n "$BACKFILL" ]; then
            python3 fetch_bhavcopy.py --backfill "$BACKFILL"
          else
            COUNT=$(ls bhavcopy_data/*.csv 2>/dev/null | wc -l || echo 0)
            if [ "$COUNT" -lt 60 ]; then
              echo "Less than 60 trading days cached — backfilling 200 calendar days"
              python3 fetch_bhavcopy.py --backfill 200
            else
              python3 fetch_bhavcopy.py
            fi
          fi

      - name: Run momentum scan
        run: python3 scan_momentum.py

      - name: Run Nifty conviction check (EOD)
        run: python3 scan_nifty_conviction.py

      - name: Commit scan results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/ data/conviction_results.csv
          if git diff --staged --quiet; then
            echo "No scan output changes to commit"
          else
            git commit -m "chore: update scans $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Save bhavcopy cache
        uses: actions/cache/save@v4
        with:
          path: bhavcopy_data
          key: bhavcopy-${{ github.run_id }}

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
