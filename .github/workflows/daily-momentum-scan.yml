name: Daily Momentum Scan

on:
  schedule:
    - cron: "30 13 * * 1-5"  # ~7:00 PM IST
  workflow_dispatch:
    inputs:
      backfill_days:
        description: "Backfill calendar days of bhavcopy (0 = today only)"
        required: false
        default: "0"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: momentum-desk-pipeline
  cancel-in-progress: false

defaults:
  run:
    working-directory: momentum-trade-desk

jobs:
  scan-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: momentum-trade-desk/requirements.txt

      - name: Restore caches
        uses: actions/cache@v4
        with:
          path: |
            momentum-trade-desk/bhavcopy_data
            momentum-trade-desk/data/runs
            momentum-trade-desk/data/predictions
            momentum-trade-desk/data/trade_log.csv
            momentum-trade-desk/data/trade_log.seed.csv
          key: desk-${{ github.run_id }}
          restore-keys: |
            desk-

      - run: pip install -r requirements.txt

      - name: Validate prior-day predictions (next-day P&L)
        run: python3 validate_trade.py

      - name: Fetch bhavcopy
        run: |
          BACKFILL="${{ github.event.inputs.backfill_days || '0' }}"
          if [ "$BACKFILL" != "0" ] && [ -n "$BACKFILL" ]; then
            python3 fetch_bhavcopy.py --backfill "$BACKFILL"
          else
            COUNT=$(ls bhavcopy_data/*.csv 2>/dev/null | wc -l || echo 0)
            if [ "$COUNT" -lt 60 ]; then
              python3 fetch_bhavcopy.py --backfill 200
            else
              python3 fetch_bhavcopy.py
            fi
          fi

      - run: python3 scan_momentum.py
      - name: Run conviction (EOD)
        env:
          RUN_KIND: eod
        run: python3 scan_nifty_conviction.py

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: momentum-trade-desk

      - id: deployment
        uses: actions/deploy-pages@v4

      - name: Save caches
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            momentum-trade-desk/bhavcopy_data
            momentum-trade-desk/data/runs
            momentum-trade-desk/data/predictions
            momentum-trade-desk/data/trade_log.csv
            momentum-trade-desk/data/trade_log.seed.csv
          key: desk-${{ github.run_id }}
