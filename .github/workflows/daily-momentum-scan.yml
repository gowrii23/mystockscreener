name: Daily Momentum Scan

on:
  schedule:
    - cron: "30 13 * * 1-5"  # ~7:00 PM IST after bhavcopy
  workflow_dispatch:
    inputs:
      backfill_days:
        description: "Backfill calendar days of bhavcopy (0 = today only)"
        required: false
        default: "0"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: momentum-repo-writes
  cancel-in-progress: false

defaults:
  run:
    working-directory: momentum-trade-desk

jobs:
  scan-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: momentum-trade-desk/requirements.txt

      - uses: actions/cache@v4
        with:
          path: momentum-trade-desk/bhavcopy_data
          key: bhavcopy-${{ github.run_id }}
          restore-keys: bhavcopy-

      - run: pip install -r requirements.txt

      - name: Fetch bhavcopy
        run: |
          BACKFILL="${{ github.event.inputs.backfill_days || '0' }}"
          if [ "$BACKFILL" != "0" ] && [ -n "$BACKFILL" ]; then
            python3 fetch_bhavcopy.py --backfill "$BACKFILL"
          else
            COUNT=$(ls bhavcopy_data/*.csv 2>/dev/null | wc -l || echo 0)
            if [ "$COUNT" -lt 60 ]; then
              python3 fetch_bhavcopy.py --backfill 200
            else
              python3 fetch_bhavcopy.py
            fi
          fi

      - run: python3 scan_momentum.py
      - run: python3 scan_nifty_conviction.py

      - name: Deploy GitHub Pages
        uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: momentum-trade-desk

      - id: deployment
        uses: actions/deploy-pages@v4

      - name: Commit results
        working-directory: ${{ github.workspace }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add momentum-trade-desk/output/ momentum-trade-desk/data/conviction_results.csv
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore: daily scan $(date -u +%Y-%m-%d)"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin main && exit 0
            echo "Push failed (attempt $attempt), retrying in ${attempt}0s..."
            sleep $((attempt * 10))
          done
          echo "Failed to push after 5 attempts"
          exit 1

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: momentum-trade-desk/bhavcopy_data
          key: bhavcopy-${{ github.run_id }}
