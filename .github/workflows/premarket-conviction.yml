name: Pre-Market Nifty Conviction Check

on:
  schedule:
    - cron: "15 3 * * 1-5"  # 8:45 AM IST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: momentum-repo-writes
  cancel-in-progress: false

defaults:
  run:
    working-directory: momentum-trade-desk

jobs:
  conviction-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: momentum-trade-desk/requirements.txt

      - run: pip install -r requirements.txt
      - run: python3 scan_nifty_conviction.py

      - name: Commit conviction log
        working-directory: ${{ github.workspace }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add momentum-trade-desk/output/nifty_setup.json momentum-trade-desk/data/conviction_results.csv
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore: pre-market conviction $(date -u +%Y-%m-%d)"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin main && exit 0
            echo "Push failed (attempt $attempt), retrying in ${attempt}0s..."
            sleep $((attempt * 10))
          done
          echo "Failed to push after 5 attempts"
          exit 1
