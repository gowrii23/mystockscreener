name: Pre-Market Nifty Conviction Check

on:
  schedule:
    - cron: "15 3 * * 1-5"  # 8:45 AM IST
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    working-directory: momentum-trade-desk

jobs:
  conviction-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: momentum-trade-desk/requirements.txt

      - run: pip install -r requirements.txt
      - run: python3 scan_nifty_conviction.py

      - name: Commit conviction log
        working-directory: ${{ github.workspace }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add momentum-trade-desk/output/nifty_setup.json momentum-trade-desk/data/conviction_results.csv
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "chore: pre-market conviction $(date -u +%Y-%m-%d)"
            git push
          fi
