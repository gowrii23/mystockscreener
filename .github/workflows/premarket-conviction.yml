name: Pre-Market Nifty Conviction Check

on:
  schedule:
    - cron: "15 3 * * 1-5"  # 8:45 AM IST
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: momentum-desk-pipeline
  cancel-in-progress: false

defaults:
  run:
    working-directory: momentum-trade-desk

jobs:
  conviction-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: momentum-trade-desk/requirements.txt

      - name: Restore run history cache
        uses: actions/cache@v4
        with:
          path: momentum-trade-desk/data/runs
          key: desk-${{ github.run_id }}
          restore-keys: desk-

      - run: pip install -r requirements.txt

      - name: Run conviction (pre-market)
        env:
          RUN_KIND: premarket
        run: python3 scan_nifty_conviction.py

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: momentum-trade-desk

      - id: deployment
        uses: actions/deploy-pages@v4

      - name: Save run history cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: momentum-trade-desk/data/runs
          key: desk-${{ github.run_id }}
